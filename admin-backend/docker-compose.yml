version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: matku_user
      POSTGRES_PASSWORD: matku_password
      POSTGRES_DB: matku_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://matku_user:matku_password@db:5432/matku_db
      - JWT_SECRET=supersecretjwtkey_replace_in_prod
      - CORS_ORIGINS=http://localhost:3000,http://localhost:8000
    depends_on:
      - db

volumes:
  postgres_data:
