name: Keep Render services warm

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend (kalyan-api)
        run: curl -sf --max-time 60 https://kalyan-api-gotl.onrender.com/ || echo "backend ping failed (may have been cold-starting)"
      - name: Ping frontend (kalyan-frontend)
        run: curl -sf --max-time 60 https://kalyan-frontend.onrender.com/login || echo "frontend ping failed (may have been cold-starting)"
